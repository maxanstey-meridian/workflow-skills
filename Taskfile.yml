version: '3'

tasks:
  build:
    desc: Build the rule files and role files, and check every rule, list, role, and citation; refuse a rule in no list, a rule file no role reads, a part no role uses, and a generated file no line builds
    cmds:
      - sh scripts/build-roles.sh

  gate:
    desc: Fail when the build refuses anything, or when a generated file was out of date
    cmds:
      - |
        sum() { find skills/*/references -type f | LC_ALL=C sort | xargs shasum | shasum; }
        before=$(sum)
        sh scripts/build-roles.sh
        [ "$before" = "$(sum)" ] || { echo 'The build changed generated files, so they were out of date. They are rebuilt now: review and commit them.' >&2; exit 1; }
