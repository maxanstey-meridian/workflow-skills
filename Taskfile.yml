version: '3'

tasks:
  build:
    desc: Build the rule files, role files, and bundled CLI .mjs scripts (spec-ctl.mjs, go-ctl.mjs, cycle-ctl.mjs, ledger.mjs, and slop-ctl.mjs), and check every rule, list, role, and citation; refuse a rule in no list, a part no role uses, and a generated file no line builds
    cmds:
      - node lib/build-roles/src/cli.ts
      - pnpm -C lib build

  typecheck:
    desc: Typecheck all TypeScript sources and tests under lib/
    cmds:
      - pnpm -C lib typecheck

  lint:
    desc: Lint all TypeScript sources and tests under lib/ with oxlint
    cmds:
      - pnpm -C lib lint

  format:check:
    desc: Check formatting of all TypeScript sources and tests under lib/ with oxfmt
    cmds:
      - pnpm -C lib format:check

  test:
    desc: Run all lib/ tests (including build-roles)
    cmds:
      - pnpm -C lib test

  gate:
    desc: Fail when the build refuses anything, when a generated file or bundled CLI .mjs script (including ledger.mjs) was out of date, when a SKILL.md holds a dollar sign followed by a digit, or when typecheck, lint, format:check, or tests fail
    cmds:
      - |
        if grep -nE '[$][0-9]' skills/*/SKILL.md; then
          echo 'A SKILL.md holds a dollar sign followed by a digit, which an agent may replace with the command'"'"'s arguments. Move that command into a script under the skill'"'"'s scripts/ folder.' >&2
          exit 1
        fi
      - |
        sum() {
          {
            find skills/*/references -type f
            for f in skills/*/kinds/*.md; do [ -f "$f" ] && echo "$f"; done
            for f in skills/*/scripts/*.mjs; do [ -f "$f" ] && echo "$f"; done
          } | LC_ALL=C sort | xargs shasum | shasum
        }
        before=$(sum)
        task build
        [ "$before" = "$(sum)" ] || { echo 'The build changed generated files or CLI bundles, so they were out of date. They are rebuilt now: review and commit them.' >&2; exit 1; }
      - task: typecheck
      - task: lint
      - task: format:check
      - task: test
