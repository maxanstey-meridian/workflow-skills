name: Roles

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  roles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: go-task/setup-task@v2
        with:
          version: 3.x
      - name: Build the rule files and role files, and fail when a committed one is out of date
        run: task gate
