name: Bundles

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  bundles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the bundles and check every citation
        run: sh scripts/build-bundles.sh
      - name: Fail when a committed bundle is out of date
        run: |
          stale=$(git status --porcelain -- 'skills/*/references/bundles/*.md')
          [ -z "$stale" ] || { printf 'Run sh scripts/build-bundles.sh and commit the result:\n%s\n' "$stale" >&2; exit 1; }
