version: "3"

# The gate: everything that must be green before this repo's work is called done.
# `task gate` runs the whole set; individual tasks are the incremental entry points.

tasks:
  api:build:
    desc: Build the API solution (analyzers on).
    cmds:
      - dotnet build api/RoomBooking.slnx

  api:test:
    desc: Run all backend tests (unit + integration on a throwaway PostgreSQL 17 Testcontainer; Docker required).
    cmds:
      - dotnet test api/RoomBooking.slnx

  api:format:check:
    desc: Verify C# formatting (CSharpier).
    cmds:
      - dotnet csharpier check api

  api:format:
    desc: Apply C# formatting.
    cmds:
      - dotnet csharpier format api

  contracts:check:
    desc: Rivet contract coverage check (every declared endpoint has a handler that binds what the contract says).
    cmds:
      - dotnet rivet --project api/src/RoomBooking.Api/RoomBooking.Api.csproj --check
            --title "Room Booking API" --version 1.0.0 --security devUser=apikey:header:X-User-Email

  contracts:verify:
    desc: Spec drift gate — the committed OpenAPI/TS artifacts match the compiled contracts.
    cmds:
      - dotnet rivet --project api/src/RoomBooking.Api/RoomBooking.Api.csproj --output packages/contracts/generated --verify
            --title "Room Booking API" --version 1.0.0 --security devUser=apikey:header:X-User-Email

  contracts:generate:
    desc: Regenerate openapi.json + schema.d.ts after a contract change.
    cmds:
      - dotnet rivet --project api/src/RoomBooking.Api/RoomBooking.Api.csproj --output packages/contracts/generated
            --title "Room Booking API" --version 1.0.0 --security devUser=apikey:header:X-User-Email
      - npx openapi-typescript packages/contracts/generated/openapi.json -o packages/contracts/generated/schema.d.ts

  ui:install:
    desc: Install the pnpm workspace (root).
    cmds:
      - pnpm install

  ui:typecheck:
    desc: Typecheck the frontend (vue-tsc).
    dir: ui
    cmds:
      - pnpm typecheck

  ui:test:
    desc: Run frontend tests (vitest).
    dir: ui
    cmds:
      - pnpm test

  ui:lint:
    desc: Lint the frontend (oxlint + eslint).
    dir: ui
    cmds:
      - pnpm lint

  ui:build:
    desc: Build the frontend (nuxt build).
    dir: ui
    cmds:
      - pnpm build

  gate:
    desc: The full gate — build, backend tests, contract gates, frontend typecheck/tests/lint/build.
    cmds:
      - task: api:build
      - task: api:test
      - task: api:format:check
      - task: contracts:check
      - task: contracts:verify
      - task: ui:typecheck
      - task: ui:test
      - task: ui:lint
      - task: ui:build

  dev:api:
    desc: Run the API on http://localhost:5000 against the provided Postgres (localhost:55471).
    cmds:
      - dotnet run --project api/src/RoomBooking.Api

  dev:ui:
    desc: Run the frontend dev server on http://localhost:3000.
    dir: ui
    cmds:
      - pnpm dev

  dev:
    desc: Run API and frontend together (Ctrl-C stops both).
    deps: [dev:api, dev:ui]
    cmds:
      - echo "API http://localhost:5000 — UI http://localhost:3000"
